<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" preserveAspectRatio="xMidYMid slice" font-family="Inter, 'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a16"/>
      <stop offset="1" stop-color="#030307"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.22" cy="0.18" r="0.6">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.85" cy="0.88" r="0.55">
      <stop offset="0" stop-color="#4f7cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4f7cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a48cff"/>
      <stop offset="1" stop-color="#5b3df5"/>
    </linearGradient>
    <linearGradient id="avatar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9b82ff"/>
      <stop offset="1" stop-color="#6a45f0"/>
    </linearGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Fundo -->
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" fill="url(#glowA)"/>
  <rect width="1200" height="1200" fill="url(#glowB)"/>
  <rect width="1200" height="1200" fill="url(#dots)"/>

  <!-- Card: receita mensal -->
  <g transform="translate(130,190) rotate(-3)">
    <rect width="470" height="235" rx="28" fill="#0d0d19" stroke="#2c2c48" stroke-width="2"/>
    <text x="34" y="56" font-size="21" fill="#9a9ab8">Receita mensal</text>
    <text x="34" y="132" font-size="56" font-weight="700" fill="#ffffff">R$ 3.300,00</text>
    <path d="M34 200 L112 178 L184 188 L262 152 L340 162 L436 112" fill="none" stroke="#9b82ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="436" cy="112" r="8" fill="#ffffff" stroke="#7c5cff" stroke-width="4"/>
  </g>

  <!-- Card: total de clientes -->
  <g transform="translate(670,130) rotate(2)">
    <rect width="380" height="205" rx="28" fill="#0d0d19" stroke="#2c2c48" stroke-width="2"/>
    <text x="34" y="56" font-size="21" fill="#9a9ab8">Total de clientes</text>
    <text x="34" y="150" font-size="76" font-weight="700" fill="#ffffff">3</text>
    <circle cx="240" cy="132" r="26" fill="url(#avatar)" stroke="#0d0d19" stroke-width="5"/>
    <circle cx="282" cy="132" r="26" fill="#4f7cff" stroke="#0d0d19" stroke-width="5"/>
    <circle cx="324" cy="132" r="26" fill="#2a2a45" stroke="#0d0d19" stroke-width="5"/>
  </g>

  <!-- Card: tarefas -->
  <g transform="translate(160,520) rotate(-1.5)">
    <rect width="530" height="340" rx="28" fill="#0d0d19" stroke="#2c2c48" stroke-width="2"/>
    <text x="34" y="58" font-size="24" font-weight="600" fill="#ffffff">Tarefas</text>

    <circle cx="52" cy="125" r="17" fill="#7c5cff"/>
    <path d="M44 125 L50 131 L61 119" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="86" y="133" font-size="23" fill="#7d7d99" text-decoration="line-through">Enviar proposta</text>

    <circle cx="52" cy="195" r="17" fill="none" stroke="#3a3a5c" stroke-width="3"/>
    <text x="86" y="203" font-size="23" fill="#ffffff">Publicar o site</text>
    <rect x="382" y="177" width="114" height="36" rx="18" fill="#7c5cff" fill-opacity="0.2"/>
    <text x="439" y="201" font-size="18" text-anchor="middle" fill="#b7a6ff">Em andamento</text>

    <circle cx="52" cy="265" r="17" fill="none" stroke="#3a3a5c" stroke-width="3"/>
    <text x="86" y="273" font-size="23" fill="#ffffff">Cobrar mensalidade</text>
  </g>

  <!-- Card: pagamentos (gráfico de barras) -->
  <g transform="translate(750,440) rotate(3)">
    <rect width="330" height="370" rx="28" fill="#0d0d19" stroke="#2c2c48" stroke-width="2"/>
    <text x="34" y="58" font-size="24" font-weight="600" fill="#ffffff">Pagamentos</text>
    <rect x="34" y="150" width="30" height="170" rx="8" fill="#26263f"/>
    <rect x="34" y="230" width="30" height="90" rx="8" fill="#26263f"/>
    <rect x="80" y="180" width="30" height="140" rx="8" fill="#26263f"/>
    <rect x="126" y="210" width="30" height="110" rx="8" fill="#26263f"/>
    <rect x="172" y="140" width="30" height="180" rx="8" fill="#26263f"/>
    <rect x="218" y="170" width="30" height="150" rx="8" fill="#26263f"/>
    <rect x="264" y="100" width="30" height="220" rx="8" fill="url(#bar)"/>
  </g>

  <!-- Aviso flutuante -->
  <g transform="translate(400,935)">
    <rect width="400" height="96" rx="48" fill="#0d0d19" stroke="#2c2c48" stroke-width="2"/>
    <circle cx="52" cy="48" r="16" fill="#22c55e" fill-opacity="0.2"/>
    <circle cx="52" cy="48" r="7" fill="#22c55e"/>
    <text x="86" y="56" font-size="24" fill="#ffffff">Pagamento recebido</text>
  </g>
</svg>
